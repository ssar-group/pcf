[workspace]
resolver = "2"

members = [
    "crates/pcf",
    "crates/pcf-source",
    "crates/pcf-span",
    "crates/pcf-token",
    "crates/pcf-lexer",
    "crates/pcf-ast",
    "crates/pcf-parser",
    "crates/pcf-diagnostics",
    "crates/pcf-resolver",
    "crates/pcf-analyzer",
    "crates/pcf-validator",
    "crates/pcf-runtime",
    "crates/pcf-stdlib",
    "crates/pcf-formatter",
    "crates/pcf-ecosystem",
    "crates/pcf-ecosystem-ssar",
    "crates/pcf-ecosystem-openscript",
    "crates/pcf-cli",
    "crates/pcf-test",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.50", features = ["derive"] }
indexmap = "2.12.0"
miette = "7.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
