# Runs Rust formatting, compilation, tests, and Clippy checks on pushes and pull requests.
# Skips the job for `[Docs]` and `[Misc]` commits or pull requests.

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    if: >
      !(
        (github.event_name == 'push' &&
          (
            startsWith(github.event.head_commit.message, '[Docs]') ||
            startsWith(github.event.head_commit.message, '[Misc]')
          )
        ) ||
        (github.event_name == 'pull_request' &&
          (
            startsWith(github.event.pull_request.title, '[Docs]') ||
            startsWith(github.event.pull_request.title, '[Misc]')
          )
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
